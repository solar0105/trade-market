<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霜落行会 · 交易行</title>

  <!-- 第三方：CSS 重置（modern-normalize, MIT） -->
  <link rel="stylesheet" href="vendor/modern-normalize.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── 顶栏：身份 / 钱包 ─────────────────────────── -->
  <header class="topbar">
    <div class="mark">霜</div>
    <div class="brand">
      <b>霜落行会 · 交易行</b>
      <span>第三服 · 秩序之环</span>
    </div>

    <nav class="nav">
      <a class="on" href="#">市场</a>
      <a href="#">委托</a>
      <a href="#">持仓</a>
      <a href="#">记录</a>
    </nav>

    <div class="spacer"></div>

    <div class="wallet" title="可用金币">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.4" stroke="#D9A566" stroke-width="1.2"/>
        <path d="M8 4.6v6.8M10.1 6.2c-.5-.8-1.3-1-2.1-1-1 0-1.7.5-1.7 1.3 0 1.9 4 1 4 2.9 0 .8-.8 1.3-1.8 1.3-.9 0-1.7-.4-2.1-1.1"
              stroke="#D9A566" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span class="num" id="wallet-gold">—</span>
    </div>

    <div class="who">
      <span class="dot"></span>
      <span id="player-name">—</span>
    </div>
  </header>

  <!-- ── 主体：左标的 / 中行情 / 右下单 ─────────────── -->
  <div class="app-body">

    <aside class="rail rail-left">
      <div class="rail-head"><span>标的</span><span>最新 / 涨跌</span></div>
      <div id="sku-list" class="sku-list"></div>
      <div class="rail-note">
        <b>标的口径</b><br>
        同一 SKU 内的道具完全可互换，价格与数量均为整数。
      </div>
    </aside>

    <main class="center">
      <section class="quote" id="quote"></section>

      <div class="chart-wrap">
        <div class="chart-h"><b>日 K</b><span id="chart-range">近 60 天</span></div>
        <!-- 图表由 lightweight-charts 渲染到这个容器里 -->
        <div id="chart" class="chart" role="img" aria-label="日 K 线图"></div>
      </div>

      <div class="low-split">
        <section class="book">
          <div class="panel-h"><span>盘口</span><span>挂出来的买卖单</span></div>
          <div id="book" class="book-body"></div>
          <div class="book-foot" id="book-foot"></div>
        </section>

        <section class="trades">
          <div class="panel-h"><span>最近成交</span><span>实时</span></div>
          <div class="cols">
            <span>时间</span><span>价格</span><span>数量</span><span></span>
          </div>
          <div id="trades" class="trades-body"></div>
        </section>
      </div>
    </main>

    <aside class="rail rail-right">

      <!-- 下单（这一步只有静态表单 + 合计计算） -->
      <form class="order-form" id="order-form" autocomplete="off">
        <div class="seg" id="side-switch">
          <button type="button" class="on" data-side="buy">买入</button>
          <button type="button" data-side="sell">卖出</button>
        </div>

        <div class="field">
          <label for="order-price">价格（金币）</label>
          <div class="input-wrap">
            <input id="order-price" inputmode="numeric" value="73">
            <span>金币</span>
          </div>
        </div>

        <div class="field">
          <label for="order-qty">数量（件）</label>
          <div class="input-wrap">
            <input id="order-qty" inputmode="numeric" value="5">
            <span>件</span>
          </div>
        </div>

        <div class="calc"><span>合计</span><b id="order-total">—</b></div>
        <div class="calc calc-lined"><span>可用余额</span><b id="order-available">—</b></div>

        <button type="submit" class="cta" id="submit-order">挂买单</button>
      </form>

      <section class="block">
        <div class="panel-h"><span>我的委托</span><span id="orders-count">—</span></div>
        <div id="my-orders"></div>
      </section>

      <section class="block">
        <div class="panel-h"><span>持仓</span><span>按标的</span></div>
        <div id="holdings"></div>
      </section>

      <section class="block block-grow">
        <div class="panel-h"><span>我的成交</span><span>今日</span></div>
        <div id="fills"></div>
        <div class="rail-foot">成交手续费 0%<br>撮合在内存完成，成交后按序号回放。</div>
      </section>

    </aside>
  </div>

  <!-- ── 底栏：工程指标 ────────────────────────────── -->
  <footer class="footer">
    <span>撮合引擎 v0 · 内存订单簿</span>
    <span>快照序号 <span class="num" id="meta-seq">—</span></span>
    <span>增量推送 <span class="num" id="meta-push">—</span></span>
    <span class="spacer"></span>
    <span>行情延迟 <span class="num" id="meta-latency">—</span></span>
    <span id="meta-status">状态 正常</span>
  </footer>

  <!--
    第三方脚本按顺序加载（defer 保证按书写顺序执行）：
      dayjs              日期处理        MIT
      lightweight-charts K 线图表        Apache-2.0，TradingView 出品
  -->
  <!-- 轻提示：下单成功 / 被拒绝时说一句人话 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/dayjs.min.js" defer></script>
  <script src="vendor/lightweight-charts.standalone.production.js" defer></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
